<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Cadastro Urna</title>
    <style>

        body { 
            font-family: sans-serif; 
            background: #f0f2f5; 
            padding: 20px; 
        }
        .card { 
            background: white; 
            padding: 20px; 
            border-radius: 8px; 
            width: 350px; 
            margin: auto; 
            box-shadow: 0 2px 5px rgba(0,0,0,0.1); 
        }
        .grupo { 
            margin-bottom: 15px; 
        }

        input, select { 
            width: 100%; 
            padding: 8px; 
            border: 1px solid #ddd; 
            border-radius: 4px; 
        }
        
        button { 
            background: #0056b3; 
            color: white; 
            border: none; 
            padding: 10px; 
            width: 100%; cursor: pointer; border-radius: 4px; }
    </style>
</head>
<body>
    <div class="card">
        <h2>Novo Candidato</h2>
        <form id="form">
            <div class="grupo">
                <label>Nome</label>
                <input type="text" name="nome">
            </div>
            <div class="grupo">
                <label>Turma</label>
                <select name="turma">
                    <option value="111">Turma 111</option>
                </select>
            </div>
            <button type="button">Cadastrar</button>
        </form>
    </div>
</body>
</html>
