<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Urna Eletrônica - La Salle Abel</title>
    <!-- Usa o static do Flask para garantir os caminhos -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/urna.css') }}">
</head>
<body>

    <!-- 
        PASSO 1: O CONTAINER DA URNA
        Ele mantém a proporção do seu design (1000x600).
        A própria urna será usada para o mesário escolher a turma.
    -->
    <div class="urna-container">
        
        <!-- 
            PASSO 2: A TELA (MONITOR)
            Posicionada via porcentagem para nunca sair do lugar.
        -->
        <div id="tela" class="tela-area">

            <div id="interface-voto">
                <div class="header-voto">Seu voto para:</div>
                <div id="cargo-nome" class="cargo-txt">CARREGANDO...</div>

                <div id="display-numeros" class="numeros-grid">
                    <!-- Gerado dinamicamente pelo script.js -->
                </div>

                <div id="dados-candidato" class="info-txt">
                    <!-- Nome e chapa aparecem aqui -->
                </div>

                <div id="instrucoes" class="rodape-txt">
                    Aperte a tecla:<br>
                    <span class="cor-verde">CONFIRMA</span> para confirmar<br>
                    <span class="cor-laranja">CORRIGE</span> para reiniciar
                </div>
            </div>

            <!-- Tela final de confirmação -->
            <div id="interface-fim" class="tela-fim">VOTO CONFIRMADO</div>
        </div>

    </div>

    <script src="{{ url_for('static', filename='js/urna.js') }}"></script>
</body>
</html>
