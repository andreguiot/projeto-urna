<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Urna Eletrônica - La Salle Abel</title>
    <!-- Usa o static do Flask para garantir os caminhos -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/urna.css') }}">
</head>
<body>

    <!-- 
        PASSO 1: O CONTAINER DA URNA
        Ele mantém a proporção do seu design (1000x600).
        A própria urna será usada para o mesário escolher a turma.
    -->
    <div class="urna-container">
        
        <!-- 
            PASSO 2: A TELA (MONITOR)
            Posicionada via porcentagem para nunca sair do lugar.
        -->
        <div id="tela" class="tela-area">

            <div id="interface-voto">
                <div class="header-voto">Seu voto para:</div>
                <div id="cargo-nome" class="cargo-txt">CARREGANDO...</div>

                <div id="display-numeros" class="numeros-grid">
                    <!-- Gerado dinamicamente pelo script.js -->
                </div>

                <div id="dados-candidato" class="info-txt">
                    <!-- Nome e chapa aparecem aqui -->
                </div>

                <div id="foto-moldura" class="foto-candidato">
                    <img id="img-candidato" src="" alt="">
                </div>

                <div id="instrucoes" class="rodape-txt">
                    Aperte a tecla:<br>
                    <span class="cor-verde">CONFIRMA</span> para confirmar<br>
                    <span class="cor-laranja">CORRIGE</span> para reiniciar
                </div>
            </div>

            <!-- Tela final de confirmação -->
            <div id="interface-fim" class="tela-fim">VOTO CONFIRMADO</div>
        </div>

        <!-- 
            PASSO 3: O TECLADO SOBREPOSTO
            Botões invisíveis que mapeiam o design da imagem.
        -->
        <div class="teclado-overlay">
            <!-- Grade para os números 1 a 9 e 0 -->
            <div class="grade-num">
                <button class="tecla-invisivel" onclick="clicou(1)">1</button>
                <button class="tecla-invisivel" onclick="clicou(2)">2</button>
                <button class="tecla-invisivel" onclick="clicou(3)">3</button>
                <button class="tecla-invisivel" onclick="clicou(4)">4</button>
                <button class="tecla-invisivel" onclick="clicou(5)">5</button>
                <button class="tecla-invisivel" onclick="clicou(6)">6</button>
                <button class="tecla-invisivel" onclick="clicou(7)">7</button>
                <button class="tecla-invisivel" onclick="clicou(8)">8</button>
                <button class="tecla-invisivel" onclick="clicou(9)">9</button>
                <button class="tecla-invisivel btn-zero" onclick="clicou(0)">0</button>
            </div>
            
            <!-- Botões de ação inferiores -->
            <div class="grade-acoes">
                <button class="btn-acao btn-branco" onclick="branco()">BRANCO</button>
                <button class="btn-acao btn-corrige" onclick="corrigir()">CORRIGE</button>
                <button class="btn-acao btn-confirma" onclick="confirmar()">CONFIRMA</button>
            </div>
        </div>

    </div>

    <script src="{{ url_for('static', filename='js/urna.js') }}"></script>
</body>
</html>
