<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel Urna - Gestão de Mídia</title>
    <link rel="stylesheet" href="../static/css/style.css">
</head>
<body>

    <div class="container">
        <!-- Formulário de Cadastro -->
        <section class="card">
            <h2>Novo Candidato</h2>
            <form id="formCadastro">
                
                <label for="nome">Nome Completo</label>
                <input type="text" id="nome" name="nome" required>
                
                <label for="numero">Número da Chapa</label>
                <input type="number" id="numero" name="numero" required>
                
                <label for="turma">Turma</label>
                <select id="turma" name="turma" required onchange="carregarLista()">
                    <option value="" disabled selected>Selecione...</option>
                    <option value="111">Turma 111</option>
                    <option value="112">Turma 112</option>
                    <option value="211">Turma 211</option>
                </select>

                <!-- Input de Foto -->
                <label class="upload-label">
                    <span>📸 Selecionar Foto do Aluno</span>
                    <input type="file" id="foto" name="foto" accept="image/*" required style="display:none;">
                </label>

                <div id="preview-container" class="preview-area">
                    <img id="preview-img" src="" alt="Prévia">
                </div>

                <button type="submit">Finalizar Cadastro</button>
            </form>
        </section>

        <!-- Listagem de Candidatos -->
        <section class="card">
            <h2>Candidatos da Turma</h2>
            <div id="lista-candidatos">
                <p>Aguardando seleção de turma...</p>
            </div>
        </section>
    </div>

    <script src="../static/js/admin.js"></script>
</body>
</html>
