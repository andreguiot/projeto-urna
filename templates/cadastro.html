<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel da Coordenação - Urna Eletrônica</title>
    <link href="https://fonts.googleapis.com/css2?family=League+Spartan:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../static/css/style.css">
</head>
<body>

    <header class="header-topo">
        <div class="texto-topo">
            <h1>Gestão de Candidatos</h1>
            <p>Cadastro de Alunos - La Salle Abel</p>
        </div>
        <img class="logo" src="{{ url_for('static', filename='images/logobranca.webp') }}" alt="Logo">
    </header>

    <main class="container">
        
        <section class="card formulario-section">
            <h2>Novo Candidato</h2>
            <form id="formCadastro">

                <div class="linha-filtros">
                    <div class="grupo-input">
                        <label for="select-segmento">Segmento</label>
                        <select id="select-segmento" required>
                            <option value="" disabled selected>Segmento...</option>
                            <option value="INF">Infantil</option>
                            <option value="EF1">Fundamental I</option>
                            <option value="EF2">Fundamental II</option>
                            <option value="EM">Ensino Médio</option>
                        </select>
                    </div>

                    <div class="grupo-input">
                        <label for="select-ano">Ano/Série</label>
                        <select id="select-ano" required disabled>
                            <option value="" disabled selected>Aguardando...</option>
                        </select>
                    </div>

                    <div class="grupo-input">
                        <label for="turma">Turma</label>
                        <select id="turma" name="turma" required disabled onchange="carregarLista()">
                            <option value="" disabled selected>Aguardando...</option>
                        </select>
                    </div>
                </div>

                <div class="grupo-input">
                    <label for="nome">Nome Completo</label>
                    <input type="text" id="nome" name="nome" placeholder="Ex: João da Silva" required>
                </div>
                
                <div class="grupo-input">
                    <label for="sexo">Sexo do Candidato</label>
                    <select id="sexo" name="sexo" required>
                        <option value="" disabled selected>Selecione...</option>
                        <option value="Feminino">Feminino</option>
                        <option value="Masculino">Masculino</option>
                    </select>
                </div>

                <div class="opcoes-candidato">
                    <div class="controle-checkbox">
                        <input type="checkbox" id="sem_foto" name="sem_foto">
                        <label for="sem_foto">Aluno não possui foto disponível</label>
                    </div>
                </div>

                <div id="area-upload" class="grupo-input upload-area">
                    <label for="foto" class="upload-label">
                        <span>📸 Carregar Foto do Aluno</span>
                        <input type="file" id="foto" name="foto" accept="image/*" required>
                    </label>
                    <div id="preview-container" class="escondido">
                        <img id="preview-img" src="" alt="Prévia">
                    </div>
                </div>

                <button type="submit" class="btn-salvar">Salvar Candidato</button>
            </form>
            <div id="feedback" class="feedback-msg"></div>
        </section>

        <section class="card lista-section">
            <div class="header-lista">
                <h2>Candidatos da Turma</h2>
                <button onclick="carregarLista()" class="btn-refresh">Atualizar</button>
            </div>
            
            <div id="lista-candidatos" class="grid-candidatos">
                <p class="aviso-vazio">Selecione uma turma para ver os candidatos.</p>
            </div>
        </section>

    </main>

    <input type="file" id="input-upload-rapido" class="escondido" accept="image/*">

    <script src="../static/js/admin.js"></script>
</body>
</html>
